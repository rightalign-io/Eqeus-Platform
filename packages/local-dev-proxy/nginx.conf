events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # CRITICAL: Allow large Base64 profile picture uploads (e.g., up to 10MB)
        client_max_body_size 10M;
        
        # Add CORS headers so frontends on different local ports aren't blocked
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # Handle preflight OPTIONS requests for CORS
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Route: Auth Service API
        location /api/auth/ {
            # Use host.docker.internal so Nginx reaches your Spring Boot app running on the host machine
            # Note the trailing slash: it strips /api/auth/ before sending to port 8080, 
            # making it match your Spring Boot @RequestMapping("/auth") cleanly.
            proxy_pass http://host.docker.internal:8080/;
        
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}